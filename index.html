<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex Wallpapers</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
padding:20px;
background:
linear-gradient(-45deg,#00c6ff,#0072ff,#7f5af0,#00f5d4,#4facfe);
background-size:400% 400%;
animation:gradientBG 14s ease infinite;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.header{
text-align:center;
margin-bottom:30px;
}

.header h1{
font-size:52px;
font-weight:bold;
letter-spacing:2px;
background:linear-gradient(to right,#ffffff,#c6f6ff,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 25px rgba(255,255,255,0.35);
margin-bottom:8px;
}

.header p{
color:white;
font-size:18px;
font-weight:bold;
opacity:0.95;
}

.category-buttons{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:12px;
margin-bottom:35px;
}

.category-buttons button{
border:none;
padding:12px 24px;
border-radius:40px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(12px);
color:white;
transition:0.3s;
}

.category-buttons button:hover{
transform:translateY(-2px) scale(1.04);
background:rgba(255,255,255,0.28);
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:22px;
}

.card{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
padding:12px;
border-radius:22px;
box-shadow:0 10px 30px rgba(0,0,0,0.20);
transition:0.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:340px;
object-fit:cover;
border-radius:18px;
cursor:pointer;
}

.download-btn{
display:block;
margin-top:12px;
text-align:center;
padding:12px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
color:white;
background:linear-gradient(to right,#00c6ff,#0072ff);
transition:0.3s;
}

.download-btn:hover{
transform:scale(1.03);
}

</style></head><body><div class="header">
<h1>Vortex Wallpapers</h1>
<p>Anime • Sports • Space • Cars</p>
</div><div class="category-buttons">
<button onclick="filterCategory('all')">All</button>
<button onclick="filterCategory('anime')">Anime</button>
<button onclick="filterCategory('sports')">Sports</button>
<button onclick="filterCategory('space')">Space</button>
<button onclick="filterCategory('cars')">Cars</button>
</div><div class="gallery" id="gallery"></div><script>

const wallpapers = [

/* Anime 15 */
...Array.from({length:18}, (_,i)=>({
file:`anime_${String(i+1).padStart(2,'0')}.jpg`,
category:'anime'
})),

/* Sports 3 */
...Array.from({length:4}, (_,i)=>({
file:`sports_${String(i+1).padStart(2,'0')}.jpg`,
category:'sports'
})),

/* Space 2 */
...Array.from({length:5}, (_,i)=>({
file:`space_${String(i+1).padStart(2,'0')}.jpg`,
category:'space'
})),

/* Cars 3 */
...Array.from({length:3}, (_,i)=>({
file:`cars_${String(i+1).padStart(2,'0')}.jpg`,
category:'cars'
}))

];

const gallery = document.getElementById("gallery");

function renderGallery(category="all"){

gallery.innerHTML="";

wallpapers.forEach(item=>{

if(category==="all" || item.category===category){

gallery.innerHTML += `

<div class="card">

<img src="${item.file}"
onclick="window.open('${item.file}','_blank')">

<a class="download-btn"
href="${item.file}"
download>
Download
</a>

</div>

`;

}

});

}

function filterCategory(category){
renderGallery(category);
}

renderGallery();

</script></body>
</html>
