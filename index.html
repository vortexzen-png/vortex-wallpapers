<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><button onclick="prevImage()" style="padding:12px 22px;border:none;border-radius:14px;background:linear-gradient(135deg,#7b2cff,#00c6ff);color:white;font-weight:600;box-shadow:0 0 12px rgba(0,198,255,.5);cursor:pointer;">⬅ Prev</button>
<title>Vortex Wallpapers</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
}

/* ===== HEADER ===== */
.header {
  text-align: center;
  padding: 20px;
}
.header h1:first-child {
  font-size: 32px;
  letter-spacing: 2px;
  color: #ffffff;
  text-shadow: 
    0 0 5px #00c6ff,
    0 0 10px #00c6ff,
    0 0 20px rgba(0, 198, 255, 0.6);
}

.header h1:last-child {
  font-size: 16px;
  font-weight: normal;
  color: #ccefff;
  opacity: 0.9;
}
/* ===== BUTTONS ===== */
.buttons {
  text-align: center;
  margin-bottom: 10px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}

/* ===== GALLERY ===== */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  padding: 15px;
}

/* ===== CARD ===== */
.card {
  background: rgba(255,255,255,0.1);
  border-radius: 15px;
  overflow: hidden;
  text-align: center;
}

.card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  cursor: pointer;
}

/* ===== DOWNLOAD ===== */
.download {
  display: block;
  padding: 10px;
  background: #00c6ff;
  color: white;
  text-decoration: none;
}

/* ===== MOBILE ONLY CHANGE ===== */
@media (max-width: 600px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .card img {
    height: 200px;
  }
}

</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="header">
  <div style="display:flex;align-items:center;justify-content:center;gap:12px;">
  <img src="logo.png" alt="Logo" style="width:60px;height:60px;border-radius:12px;">
 <h1 style="font-size:2rem;margin:0;font-family:'Orbitron',sans-serif;font-weight:500;letter-spacing:2px;color:#dbe7ff;">Vortex Wallpapers</h1>
</div>
</div>

<div class="buttons">
  <button onclick="filter('all')">All</button>
  <button onclick="filter('anime')">Anime</button>
  <button onclick="filter('sports')">Sports</button>
  <button onclick="filter('cosmic')">Cosmic</button>
  <button onclick="filter('cars')">Cars</button>
</div>

<div class="gallery" id="gallery"></div>

<script>

/* ===== AUTO GENERATION SYSTEM ===== */

let categories = {
  anime: 23,
  sports: 13,
  cosmic: 5,
  cars: 7
};

function generateList() {
  let data = [];

  Object.keys(categories).forEach(cat => {
    let count = categories[cat];

    data.push(
      ...Array.from({length: count}, (_, i) => ({
        file: `${cat}_${String(i+1).padStart(2,'0')}.jpg`,
        category: cat
      }))
    );
  });

  return data;
}

let wallpapers = generateList();

/* ===== RENDER ===== */

function load(category="all") {
  let gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  wallpapers
  .filter(w => category === "all" || w.category === category)
  .forEach(w => {

    gallery.innerHTML += `
      <div class="card">
        <img src="${w.file}" onclick="openImg('${w.file}')">
        <a class="download" href="${w.file}" download>Download</a>
      </div>
    `;
  });
}

/* ===== FILTER ===== */

function filter(cat) {
  load(cat);
}

/* ===== OPEN IMAGE ===== */

let currentIndex = 0;

function openImg(file) {
  currentIndex = wallpapers.findIndex(w => w.file === file);

  document.getElementById("viewer").style.display = "flex";
  document.getElementById("viewerImg").src = file;
  document.getElementById("downloadBtn").href = file;
}

function closeViewer() {
  document.getElementById("viewer").style.display = "none";
}

function nextImage() {
  currentIndex = (currentIndex + 1) % wallpapers.length;

  let file = wallpapers[currentIndex].file;

  document.getElementById("viewerImg").src = file;
  document.getElementById("downloadBtn").href = file;
}

function prevImage() {
  currentIndex =
    (currentIndex - 1 + wallpapers.length) %
    wallpapers.length;

  let file = wallpapers[currentIndex].file;

  document.getElementById("viewerImg").src = file;
  document.getElementById("downloadBtn").href = file;
}

load();

</script>
<div id="viewer" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;justify-content:center;align-items:center;flex-direction:column;">

  <button onclick="closeViewer()" style="position:absolute;top:20px;right:20px;padding:10px 15px;border:none;border-radius:10px;background:red;color:white;font-size:18px;">✕</button>

  <img id="viewerImg" src="" style="max-width:90%;max-height:75%;border-radius:15px;">

  <div style="margin-top:20px;display:flex;gap:10px;">
  
<button onclick="prevImage()" style="padding:12px 22px;border:none;border-radius:14px;background:linear-gradient(135deg,#7b2cff,#00c6ff);color:white;font-weight:600;box-shadow:0 0 12px rgba(0,198,255,.5);cursor:pointer;">Prev ←</button>

    <a id="downloadBtn" href="" download style="padding:12px 22px;border-radius:14px;background:linear-gradient(135deg,#7b2cff,#00c6ff);color:white;text-decoration:none;font-weight:600;box-shadow:0 0 12px rgba(0,198,255,.5);">Download ▼</a>

    <button onclick="nextImage()" style="padding:12px 22px;border:none;border-radius:14px;background:linear-gradient(135deg,#7b2cff,#00c6ff);color:white;font-weight:600;box-shadow:0 0 12px rgba(0,198,255,.5);cursor:pointer;">Next ➡</button>

  </div>
</div>
</body>

</html>
