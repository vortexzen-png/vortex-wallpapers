<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex Wallpapers</title>

<style>

/* ===== BACKGROUND ===== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
}

/* ===== HEADER ===== */
.header {
  text-align: center;
  padding: 20px;
}
.header h1:first-child {
  font-size: 32px;
  letter-spacing: 2px;
  color: #ffffff;
  text-shadow: 
    0 0 5px #00c6ff,
    0 0 10px #00c6ff,
    0 0 20px rgba(0, 198, 255, 0.6);
}

.header h1:last-child {
  font-size: 16px;
  font-weight: normal;
  color: #ccefff;
  opacity: 0.9;
}
/* ===== BUTTONS ===== */
.buttons {
  text-align: center;
  margin-bottom: 10px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}

/* ===== GALLERY ===== */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  padding: 15px;
}

/* ===== CARD ===== */
.card {
  background: rgba(255,255,255,0.1);
  border-radius: 15px;
  overflow: hidden;
  text-align: center;
}

.card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  cursor: pointer;
}

/* ===== DOWNLOAD ===== */
.download {
  display: block;
  padding: 10px;
  background: #00c6ff;
  color: white;
  text-decoration: none;
}

/* ===== MOBILE ONLY CHANGE ===== */
@media (max-width: 600px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .card img {
    height: 200px;
  }
}

</style>
</head>

<body>

<div class="header">
  <h1>Vortex Wallpapers</h1>
</div>

<div class="buttons">
  <button onclick="filter('all')">All</button>
  <button onclick="filter('anime')">Anime</button>
  <button onclick="filter('sports')">Sports</button>
  <button onclick="filter('cosmic')">Cosmic</button>
  <button onclick="filter('cars')">Cars</button>
</div>

<div class="gallery" id="gallery"></div>

<script>

/* ===== AUTO GENERATION SYSTEM ===== */

let categories = {
  anime: 21,
  sports: 7,
  cosmic: 5,
  cars: 6
};

function generateList() {
  let data = [];

  Object.keys(categories).forEach(cat => {
    let count = categories[cat];

    data.push(
      ...Array.from({length: count}, (_, i) => ({
        file: `${cat}_${String(i+1).padStart(2,'0')}.jpg`,
        category: cat
      }))
    );
  });

  return data;
}

let wallpapers = generateList();

/* ===== RENDER ===== */

function load(category="all") {
  let gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  wallpapers
  .filter(w => category === "all" || w.category === category)
  .forEach(w => {

    gallery.innerHTML += `
      <div class="card">
        <img src="${w.file}" onclick="openImg('${w.file}')">
        <a class="download" href="${w.file}" download>Download</a>
      </div>
    `;
  });
}

/* ===== FILTER ===== */

function filter(cat) {
  load(cat);
}

/* ===== OPEN IMAGE ===== */

function openImg(file) {
  window.open(file, "_blank");
}

load();

</script>

</body>
</html>
